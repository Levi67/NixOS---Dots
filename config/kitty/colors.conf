# Wallust Kitty Template

# --- THE FIXED BACKGROUND ---
# This ensures your background is ALWAYS #2f2f2f regardless of the wallpaper
background #2f2f2f
background_opacity 0.60

# --- THE TEXT (Foreground) ---
# Use color7 (usually a bright grey/white) so it's always readable
foreground #ffffff

# --- THE ACCENTS (The 16 colors) ---
# These will still change based on your wallpaper for syntax highlighting
color0  #000005
color1  #374D5C
color2  #374D5C
color3  #9AB0D3
color4  #A1BCDE
color5  #B4C5DF
color6  #BCCDE7
color7  #D5DEEB
color8  #959BA4

# Input text Color
color9  #e0e0e0

color10 #374D5C
color11 #9AB0D3
color12 #A1BCDE
color13 #B4C5DF
color14 #BCCDE7
color15 #D5DEEB

# Selection colors
selection_foreground #000005
selection_background #D5DEEB

# Cursor
cursor #D5DEEB