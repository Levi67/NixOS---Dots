color1  #604E43
color2  #655E5A
color3  #66605C
color4  #6E6863
color5  #E1D7C6
color6  #EAE1CF
color7  #ECE7DF
color8  #A5A29C

# Input text Color
color9  #e0e0e0

color10 #655E5A
color11 #66605C
color12 #6E6863
color13 #E1D7C6
color14 #EAE1CF
color15 #ECE7DF

# Selection colors
selection_foreground #050000
