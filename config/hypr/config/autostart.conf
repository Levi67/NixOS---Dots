# Start the wallpaper daemon
exec-once = swww-daemon

# Start Quickshell
exec-once = qs

exec-once = qs --path ~/.config/quickshell/launcher.qml






# Restore the last wallpaper you picked in the Waypaper GUI
exec-once = waypaper --restore


exec-once = ~/.config/scripts/swww-wallust-executer.sh


